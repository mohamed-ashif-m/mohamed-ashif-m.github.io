<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohamed Ashif - Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .container {
            text-align: center;
            padding: 3rem 2rem;
            max-width: 700px;
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .crane-icon {
            width: 200px;
            height: 200px;
            margin: 0 auto 2rem;
        }

        .crane-icon svg {
            width: 100%;
            height: 100%;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 700;
            color: #000000;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        p {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            color: #333333;
            font-weight: 400;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 2.5rem 1.5rem;
            }

            .crane-icon {
                width: 160px;
                height: 160px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 2rem 1.2rem;
                border-radius: 15px;
            }

            .crane-icon {
                width: 130px;
                height: 130px;
                margin-bottom: 1.5rem;
            }
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="crane-icon">
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <!-- Tower Crane -->
                <!-- Base platform -->
                <rect x="30" y="165" width="140" height="15" rx="3" fill="#000000"/>
                <rect x="40" y="170" width="120" height="5" fill="#1a1a1a"/>
                
                <!-- Tower -->
                <rect x="44" y="50" width="6" height="120" fill="#2d2d2d"/>
                <rect x="54" y="50" width="6" height="120" fill="#2d2d2d"/>
                <line x1="47" y1="60" x2="57" y2="60" stroke="#000000" stroke-width="1.5"/>
                <line x1="47" y1="80" x2="57" y2="80" stroke="#000000" stroke-width="1.5"/>
                <line x1="47" y1="100" x2="57" y2="100" stroke="#000000" stroke-width="1.5"/>
                <line x1="47" y1="120" x2="57" y2="120" stroke="#000000" stroke-width="1.5"/>
                <line x1="47" y1="140" x2="57" y2="140" stroke="#000000" stroke-width="1.5"/>
                <line x1="47" y1="160" x2="57" y2="160" stroke="#000000" stroke-width="1.5"/>
                
                <!-- Crane arm -->
                <rect x="50" y="48" width="120" height="8" rx="2" fill="#000000"/>
                <rect x="50" y="50" width="120" height="3" fill="#333333" opacity="0.7"/>
                
                <!-- Counter weight -->
                <rect x="25" y="45" width="30" height="14" rx="2" fill="#1a1a1a"/>
                <rect x="28" y="48" width="24" height="3" fill="#333333"/>
                
                <!-- Arm support lines -->
                <line x1="60" y1="52" x2="70" y2="42" stroke="#000000" stroke-width="1.5"/>
                <line x1="80" y1="52" x2="90" y2="42" stroke="#000000" stroke-width="1.5"/>
                <line x1="100" y1="52" x2="110" y2="42" stroke="#000000" stroke-width="1.5"/>
                <line x1="120" y1="52" x2="130" y2="42" stroke="#000000" stroke-width="1.5"/>
                
                <!-- Top support beam -->
                <line x1="60" y1="42" x2="140" y2="42" stroke="#000000" stroke-width="2"/>
                
                <!-- Pulley -->
                <circle cx="145" cy="52" r="4" fill="#000000"/>
                <circle cx="145" cy="52" r="2" fill="#333333"/>
                
                <!-- Cable and hook -->
                <line x1="145" y1="56" x2="145" y2="110" stroke="#000000" stroke-width="1.5"/>
                
                <!-- Hook -->
                <path d="M 145 110 Q 148 112 148 116 Q 148 118 146 118 Q 144 118 144 116" 
                      fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
                <circle cx="145" cy="110" r="2" fill="#000000"/>
                
                <!-- Weight being lifted -->
                <rect x="135" y="120" width="20" height="18" rx="2" fill="#1a1a1a"/>
                <rect x="137" y="122" width="16" height="3" fill="#333333"/>
                <line x1="138" y1="126" x2="152" y2="126" stroke="#000000" stroke-width="1"/>
                <line x1="138" y1="130" x2="152" y2="130" stroke="#000000" stroke-width="1"/>
                <line x1="138" y1="134" x2="152" y2="134" stroke="#000000" stroke-width="1"/>
            </svg>
        </div>
        <h1>Mohamed Ashif's Portfolio</h1>
        <p>Under Construction</p>
    </div>
</body>
</html>
